name: Update Live Scores
on:
  schedule:
    - cron: '*/2 16-23 * 3-10 *'
    - cron: '*/5 0-5 * 3-10 *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install httpx

      - name: Fetch live scores
        run: python generate_live_data.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      - name: Copy static files to docs
        run: |
          cp index.html docs/
          cp soccer_data.json docs/
          cp privacy.html docs/ || true
          cp terms.html docs/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: ./
          keep_files: true
